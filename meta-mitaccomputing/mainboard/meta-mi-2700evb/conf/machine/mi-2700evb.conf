# Walnascar compatibility overrides must precede SDK includes (hard = / :aarch64
# beat the SDK's ?= for FIT class and TF-A deploy path).
# A2 boot chain modeled on ast2700-default.conf (non-PFR EVB; no Ibex-SPL / U-Boot FIT merge).
require conf/machine/include/mitac-aspeed-sdk-walnascar.inc
require conf/machine/include/ast2700-sdk.inc
require conf/machine/include/ast-ssp.inc
require conf/machine/include/ast-tsp.inc
require conf/machine/include/obmc-bsp-common.inc

KMACHINE = "aspeed"

# 128 MiB flash; A2 head-of-flash matches SDK ast2700-default:
# env@4096, kernel@4224, rofs@13440, rwfs@98304
FLASH_SIZE = "131072"
FLASH_UBOOT_OFFSET:flash-131072 = "0"
FLASH_UBOOT_ENV_OFFSET:flash-131072 = "4096"
FLASH_KERNEL_OFFSET:flash-131072 = "4224"
FLASH_ROFS_OFFSET:flash-131072 = "13440"
FLASH_RWFS_OFFSET:flash-131072 = "98304"
RWFS_SIZE = "33554432"

# CALIPTRA Settings (A2)
CALIPTRA_FW_BINARY = "caliptra-fw-v2.bin"

# BootMCU Build Settings (A2 Zephyr runtime via Caliptra manifest)
BOOTMCU_FW_BINARY = "ast2700-mcu-runtime.bin"

# U-Boot Build Settings
UBOOT_MACHINE = "evb-ast2700_defconfig"
UBOOT_DEVICETREE = "ast2700-evb"
UBOOT_SIGN_ENABLE = "1"

OBMC_COMPATIBLE_NAMES = "com.mitac.Hardware.BMC.Model.Mi-2700EVB"

require conf/machine/include/mitac.inc
# mitac.inc sets ttyS4 with hard "="; AST2700 EVB console is uart12 (DTS stdout-path).
SERIAL_CONSOLES = "115200;ttyS12"

KBUILD_DEFCONFIG = "aspeed_g7_defconfig"
KERNEL_DEVICETREE += "aspeed/aspeed-bmc-mitac-base.dtb"

PLATFORM_PROFILES = " \
	com.mitac.Hardware.Chassis.Model.Template \
	"

# From community
#SOCSEC_SIGN_ENABLE = "0"
# TODO: From AMD...
#UBOOT_SIGN_ENABLE = "0"

EXTRA_IMAGEDEPENDS:append = " \
    aspeed-image-recoveryuart \
    "

# After ast2700-sdk.inc: use A2 EVB (QEMU 11.0.1; alias ast2700-evb also maps to A2).
QB_MACHINE = "-machine ast2700a2-evb"
