# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# SDK root classes (otptool, socsec-sign, …) for AST2600 machines that do not
# add aspeed-sdk-layer to BBLAYERS. AST2700 already has this path via the SDK
# BBLAYER; a duplicate BBPATH entry is harmless.
BBPATH .= ":${LAYERDIR}/common/aspeedtech-bmc.meta-aspeed-sdk"

# When aspeed-sdk-layer is not in BBLAYERS (AST2600), still resolve LICENSE
# checksums in SDK image recipes. aspeed-sdk-layer's layer.conf overrides this
# with '=' to the same path.
ASPEEDSDKBASE ?= '${@os.path.normpath("${LAYERDIR}/common/aspeedtech-bmc.meta-aspeed-sdk")}'

# MiTAC common recipes intentionally globbed here (not separate BBLAYERS):
#   common/core, common/intel-bmc, common/aspeedtech-bmc.meta-aspeed-sdk,
#   common/amdese.meta-amd (cpu-info, amd-ras, …), common/accessory (bbappends).
# Aspeed SDK *sublayers* (meta-ast2700-sdk, PFR, Zephyr) stay real BBLAYERS on
# AST2700 only. The SDK *root* is still globbed here so AST2600 platforms keep
# linux-aspeed 6.12, u-boot 2023.10, i3c-tools, and the matching common/core
# bbappends. BitBake deduplicates the same paths when aspeed-sdk-layer is also
# in BBLAYERS.
#
# Keep .bb globs broad. bbappends that require meta-aspeed-pfr recipes are gated
# via BBFILES_DYNAMIC so non-PFR machines (e.g. mi-2700evb) do not dangle.
BBFILES += "${LAYERDIR}/common/core/recipes-*/*/*.bb \
            ${LAYERDIR}/common/core/recipes-aspeed/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-bsp/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-connectivity/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-core/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-extended/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-kernel/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-mitac/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-phosphor/*/*.bbappend \
            ${LAYERDIR}/common/core/recipes-support/boost/*.bbappend \
            ${LAYERDIR}/common/core/recipes-support/i3c-tools/*.bbappend \
            ${LAYERDIR}/common/core/recipes-support/mctp/*.bbappend \
            ${LAYERDIR}/common/core/recipes-support/ncsi-netlink/*.bbappend \
            ${LAYERDIR}/common/core/recipes-x86/*/*.bbappend \
            ${LAYERDIR}/common/intel-bmc/recipes-*/*/*.bb \
            ${LAYERDIR}/common/intel-bmc/recipes-*/*/*.bbappend \
            ${LAYERDIR}/common/aspeedtech-bmc.meta-aspeed-sdk/recipes-*/*/*.bb \
            ${LAYERDIR}/common/aspeedtech-bmc.meta-aspeed-sdk/recipes-*/*/*.bbappend \
            ${LAYERDIR}/common/amdese.meta-amd/recipes-*/*/*.bb \
            ${LAYERDIR}/common/amdese.meta-amd/recipes-*/*/*.bbappend \
            ${LAYERDIR}/common/accessory/recipes-*/*/*.bbappend"

# Selective backport: MiTAC NDA bmcweb (dev-MiOBMC) requires Boost >= 1.88.0
# and libnghttp2 >= 1.66.0.
# Do not enable the rest of backport-openbmc (conflicts with OpenBMC 2.18 recipes).
BBFILES += "${LAYERDIR}/common/backport-openbmc/recipes-support/boost/boost_1.88.0.bb \
            ${LAYERDIR}/common/backport-openbmc/recipes-support/nghttp2/nghttp2_1.69.0.bb"

# Intel/PFR Walnascar S= fixes — only when aspeed-pfr-layer is in BBLAYERS.
BBFILES_DYNAMIC += " \
    aspeed-pfr-layer:${LAYERDIR}/common/core/recipes-intel/*/*.bbappend \
    aspeed-pfr-layer:${LAYERDIR}/common/core/recipes-support/spdm-emu/*.bbappend \
"

BBFILE_COLLECTIONS += "mitac-layer"
BBFILE_PATTERN_mitac-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_mitac-layer = "10"
LAYERSERIES_COMPAT_mitac-layer = "walnascar scarthgap"
